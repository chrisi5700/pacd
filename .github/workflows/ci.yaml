name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'bench/**'
      - 'playground/**'
      - 'tools/**'
      - 'examples/**'
      - 'include/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'bench/**'
      - 'playground/**'
      - 'tools/**'
      - 'examples/**'
      - 'include/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'vcpkg.json'
      - '.github/workflows/**'
jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        # Pinned so the check is reproducible: apt's clang-format floats with the
        # runner image, and formatting output differs across major versions.
        run: |
          pipx install clang-format==18.1.8
          clang-format --version

      - name: Check formatting
        run: |
          find src tests \( -name "*.cpp" -o -name "*.hpp" \) | \
            xargs clang-format --dry-run --Werror

  clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '6d7bf7ef2193e2d1c5798a5ff8811d533104c861'

      - name: Install Clang + analysis tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang clang-tidy cppcheck \
            libxinerama-dev libxcursor-dev xorg-dev libglu1-mesa-dev

      - uses: lukka/run-cmake@v10
        with:
          configurePreset: dev-vcpkg
          configurePresetAdditionalArgs: >
            ["-DCMAKE_CXX_COMPILER=clang++",
             "-DENABLE_CLANG_TIDY=ON",
             "-DENABLE_CPPCHECK=ON"]
          buildPreset: dev-vcpkg

      - name: Test
        run: ctest --test-dir build/dev-vcpkg --output-on-failure

  gcc-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '6d7bf7ef2193e2d1c5798a5ff8811d533104c861'

      - name: Install GCC + lcov
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc g++ lcov \
            libxinerama-dev libxcursor-dev xorg-dev libglu1-mesa-dev

      - uses: lukka/run-cmake@v10
        with:
          configurePreset: dev-vcpkg
          configurePresetAdditionalArgs: >
            ["-DCMAKE_CXX_COMPILER=g++"]
          buildPreset: dev-vcpkg

      - name: Run tests + coverage
        run: ./scripts/run_test.sh build/dev-vcpkg example_test

   #    - name: Upload coverage
   #      uses: coverallsapp/github-action@v2
   #      with:
   #        github-token: ${{ secrets.GITHUB_TOKEN }}
   #        file: build/dev-vcpkg/coverage_filtered.info

  msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '6d7bf7ef2193e2d1c5798a5ff8811d533104c861'

      - uses: lukka/run-cmake@v10
        with:
          configurePreset: dev-vcpkg-msvc
          buildPreset: dev-vcpkg-msvc

      - name: Test
        run: ctest --test-dir build/dev-vcpkg-msvc --output-on-failure

  core:
    # Guards the consumable-library path: the lean solver must build as C++20 with
    # no package manager and no GL/logging dependencies, install cleanly, and be
    # usable from a downstream find_package(pacd) project via the pacd::solver target.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest

      - name: Build lean core (no vcpkg, no deps)
        run: |
          cmake --preset core
          cmake --build --preset core

      - name: Install and consume from a downstream project
        run: |
          cmake --install build/core --prefix "${{ github.workspace }}/_install"
          cmake -S examples/consumer -B build/consumer \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/_install" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/consumer
          "${{ github.workspace }}/build/consumer/pacd_consumer"